
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelops-api
  template:
    metadata:
      labels:
        app: modelops-api
    spec:
      containers:
        - name: modelops-api
          image: modelops-lite:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
